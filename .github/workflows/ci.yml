name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    name: Mobile app (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
      - run: npm test -- --ci
        working-directory: apps/mobile

  admin:
    name: Admin panel (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
        working-directory: apps/admin
      - run: npx tsc --noEmit
        working-directory: apps/admin
      - run: npx vitest run
        working-directory: apps/admin

  edge-functions:
    name: Edge Functions (Deno tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-read
        working-directory: supabase/functions/import-contacts-csv

  database:
    name: Database schema + RLS (local Postgres via Supabase CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase migration up --local
      - name: Verify RLS is enabled on every table
        run: |
          RESULT=$(supabase db query --local -o json "select relname from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r' and not c.relrowsecurity;")
          # supabase db query -o json has returned both a bare array and a
          # {rows:[...]} wrapper across CLI versions -- handle either shape.
          ROWS=$(echo "$RESULT" | jq 'if type == "array" then length else (.rows // []) | length end')
          if [ "$ROWS" != "0" ]; then
            echo "Tables without RLS enabled found: $RESULT"
            exit 1
          fi
          echo "All public tables have RLS enabled."
      - name: Load seed data and verify row counts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/seed.sql
          COUNT=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -tAc "select count(*) from track_challenges;")
          if [ "$COUNT" != "60" ]; then
            echo "Expected 60 seeded challenges, got $COUNT"
            exit 1
          fi
